name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test on macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          xcode-select -p

      - name: Show Swift Toolchain
        run: |
          swift --version
          uname -a

      - name: Validate Game Profile JSON Schemas
        run: |
          for f in data/profiles/*.json; do
            if [ "$f" != "data/profiles/schema.json" ]; then
              echo "Validating JSON syntax: $f"
              plutil -lint "$f" || python3 -m json.tool "$f" > /dev/null
            fi
          done

      - name: Build MacOSGaming (Core & CLI)
        run: swift build -v

      - name: Run Unit Tests
        run: swift test -v

      - name: Run Smoke Test on CLI
        run: |
          .build/debug/macosgaming doctor
          .build/debug/macosgaming setup
          .build/debug/macosgaming steam
          .build/debug/macosgaming list
          .build/debug/macosgaming info valorant
          .build/debug/macosgaming test-run elden-ring --offline
          .build/debug/macosgaming launch elden-ring --offline --dry-run
          .build/debug/macosgaming validate dota-2 --dry-run

  phase-2-tests:
    name: Phase 2 Steam & Launch Flow Tests
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          xcode-select -p

      - name: Run Phase 2 Unit Tests
        run: |
          swift test --filter SteamLibraryDetectorTests -v
          swift test --filter GameLauncherTests -v
          swift test --filter DependencyManagerTests -v

      - name: Verify CLI Launch and Setup Commands
        run: |
          swift build -c release
          .build/release/macosgaming setup
          .build/release/macosgaming steam
          .build/release/macosgaming launch elden-ring --offline --dry-run

  phase-3-tests:
    name: Phase 3 Real-Game Validation & Signal Tests
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          xcode-select -p

      - name: Run Phase 3 Unit Tests
        run: |
          swift test --filter GameValidatorTests -v
          swift test --filter ProcessRunnerSignalTests -v
          swift test --filter GameLauncherRetryTests -v

      - name: Verify CLI Validation Command & Report Sanitization
        run: |
          swift build -c release
          .build/release/macosgaming validate dota-2 --dry-run
          test -f docs/validation/dota-2-report.md
          ! grep -E "/Users/[a-zA-Z0-9]+" docs/validation/dota-2-report.md

  validate-sources:
    name: Validate Profile Source URLs (HTTP 200)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Source Validation Script
        run: |
          chmod +x scripts/validate_sources.sh
          ./scripts/validate_sources.sh

  phase-4-app-tests:
    name: Phase 4 SwiftUI App Build & ViewModel Tests
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          xcode-select -p

      - name: Build MacOSGamingApp (Debug & Release)
        run: |
          swift build --product MacOSGamingApp -v
          swift build --product MacOSGamingApp -c release -v

      - name: Run SwiftUI App ViewModel Unit Tests
        run: |
          swift test --filter MacOSGamingAppTests -v

      - name: Verify App Executable Binary
        run: |
          BIN_DIR=$(swift build -c release --show-bin-path)
          echo "Release binary directory: $BIN_DIR"
          test -x "$BIN_DIR/MacOSGamingApp"
          echo "MacOSGamingApp binary successfully verified at $BIN_DIR/MacOSGamingApp."



