name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/website/**'
      - 'data/profiles/**'
      - 'scripts/generate_compatibility_page.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Compatibility Matrix Page
        run: |
          chmod +x scripts/generate_compatibility_page.py
          python3 scripts/generate_compatibility_page.py
          python3 scripts/generate_compatibility_page.py --check
          ls -la docs/website/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
